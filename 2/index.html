<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Data+ Academy #2</title>
  <meta name="description" content="Data+ Academy, edition 2: coming soon.">
  <script>
    // /1 → /1/ : relative paths (academy.css, content/…) only resolve with the trailing slash.
    // GitHub Pages redirects by itself; the local dev server (serve) does not.
    if (!/\/$|\.html?$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);
  </script>
  <link rel="icon" type="image/png" href="../assets/logos/logo-grau.png">
  <script>
    try { var t = localStorage.getItem("academy-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <!-- Placeholder until edition 2 is branched from ../1/ (copy the folder, edit content/academy.js). -->
  <style>
    @font-face { font-family: "Montserrat"; font-weight: 400; font-display: swap; src: url("../assets/fonts/montserrat-400.woff2") format("woff2"); }
    @font-face { font-family: "Montserrat"; font-weight: 600; font-display: swap; src: url("../assets/fonts/montserrat-600.woff2") format("woff2"); }
    @font-face { font-family: "Montserrat"; font-weight: 700; font-display: swap; src: url("../assets/fonts/montserrat-700.woff2") format("woff2"); }
    /* dark = leitart.de colours, light = Data+ webinar palette (same tokens as ../1/academy.css) */
    :root {
      --bg: #2E353A; --surface: #3A4248; --fg: rgba(255, 255, 255, .80); --fg-strong: #FFFFFF; --muted: #9AA3A8;
      --line: rgba(255, 255, 255, .14); --accent: #4CA0AA; --gold: #FABB00; --focus: #FABB00;
      --logo-dark: block; --logo-light: none;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #F2F5F5; --surface: #FFFFFF; --fg: #3B4449; --fg-strong: #232A2D; --muted: #5F666A;
      --line: rgba(59, 68, 73, .16); --accent: #266874; --gold: #B3524B; --focus: #266874;
      --logo-dark: none; --logo-light: block; color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 "Montserrat", Arial, Helvetica, sans-serif; }
    .page { min-height: 100%; display: flex; flex-direction: column; max-width: 1360px; margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 0 12px; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo { height: 44px; width: auto; }
    .logo-on-dark { display: var(--logo-dark); }
    .logo-on-light { display: var(--logo-light); }
    .brand span { font-weight: 600; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); padding-left: 12px; border-left: 1px solid var(--line); }
    main { flex: 1 1 auto; display: grid; align-content: center; gap: 18px; padding-block: 32px; }
    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 0; font-weight: 600; color: var(--fg-strong); font-size: clamp(44px, 9vw, 120px); line-height: 1; letter-spacing: -.02em; }
    h1 span { color: var(--accent); }
    .date { font-weight: 600; font-size: clamp(18px, 2.2vw, 24px); color: var(--fg-strong); }
    .date small { display: block; font-size: 14px; font-weight: 400; color: var(--muted); margin-top: 4px; }
    .back { justify-self: start; display: inline-flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 18px; text-decoration: none; color: var(--fg-strong);
      background: var(--surface); border: 1px solid var(--line); border-radius: 28px 0 28px 10px; }
    .back:hover { border-color: var(--accent); }
    .back small { color: var(--muted); }
    .icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 12px 0 12px 4px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
    .icon-btn:hover { border-color: var(--accent); }
    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-btn .sun { display: var(--logo-dark); }
    .icon-btn .moon { display: var(--logo-light); }
    footer { border-top: 1px solid var(--line); padding-top: 8px; font-size: 12px; color: var(--muted); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="../" aria-label="Data+ Academy">
        <img class="logo logo-on-dark" src="../assets/logos/logo-weiss.png" alt="data plus · a leitart solution" width="724" height="683">
        <img class="logo logo-on-light" src="../assets/logos/logo-grau.png" alt="data plus · a leitart solution" width="724" height="683">
        <span>Academy</span>
      </a>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch theme (T)" title="Switch theme (T)">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </header>

    <main>
      <div class="eyebrow">Data+ Academy #2</div>
      <h1>Coming <span>soon…</span></h1>
      <div class="date">Wednesday, 16 December 2026 · 16:00 CET<small>The agenda follows here.</small></div>
      <a class="back" href="../1/">Data+ Academy #1 <small>What's cooking in Data+ · 24 Nov 2026</small></a>
    </main>

    <footer>Dataplus · a Leitart solution · Berlin</footer>
  </div>
  <script>
    (function () {
      var root = document.documentElement;
      function current() {
        var t = root.dataset.theme;
        return t === "light" ? "light" : "dark";
      }
      function toggle() {
        var next = current() === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try { localStorage.setItem("academy-theme", next); } catch (e) {}
      }
      document.getElementById("themeBtn").addEventListener("click", toggle);
      document.addEventListener("keydown", function (e) {
        if (!e.ctrlKey && !e.metaKey && !e.altKey && (e.key === "t" || e.key === "T")) toggle();
      });
    })();
  </script>
</body>
</html>
